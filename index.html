<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Phone OTP Verification</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <div class="card">

      <h1>Phone Verification</h1>
      <p class="subtitle">Verify your mobile number using OTP</p>

      <!-- Phone Section -->
      <div id="phoneSection">
        <label>Mobile Number</label>

        <div class="phone-box">
          <span>+91</span>
          <input
            type="tel"
            id="phone"
            placeholder="Enter 10 digit number"
            maxlength="10"
          >
        </div>

        <div id="recaptcha-container"></div>

        <button id="sendOtpBtn">Send OTP</button>
      </div>

      <!-- OTP Section -->
      <div id="otpSection" class="hidden">
        <label>Enter OTP</label>

        <input
          type="text"
          id="otp"
          placeholder="Enter 6 digit OTP"
          maxlength="6"
        >

        <button id="verifyBtn">Verify OTP</button>

        <button id="backBtn" class="secondary">
          Change Number
        </button>
      </div>

      <!-- Success -->
      <div id="successSection" class="hidden success">
        <div class="check">✓</div>
        <h2>Verified Successfully!</h2>
        <p id="verifiedNumber"></p>
        <button id="logoutBtn" class="secondary">Logout</button>
      </div>

      <p id="message"></p>

    </div>
  </div>

  <script type="module" src="script.js"></script>
</body>
</html>
